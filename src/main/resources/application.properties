# å¬æµæä»¤éåï¼è®¾å¤æ¹æä¾ï¼åç»­è¥åæ´ä»æ¹æ­¤å¤ï¼
recall.queue=rtu_ythzm_test
# recall timeout seconds: sync wait for RTU response after sending recall command
# device side feedback: RTU response may take up to 5 minutes, so set 360s (5min + 1min buffer)
recall.timeout-seconds=360

# threshold alarm repeat suppression (minutes): min interval between two alerts for the same
# site+type(+zb) under continuous exceedance; recovery auto-close resets the counter
# 阈值告警重复抑制：同站点同类型(多指标再区分zb)持续超限时两次告警的最小间隔(分钟)
alarm.suppress-minutes=30

# work order: upstream reservoir site list (stcd, comma separated; all other sites belong to downstream)
# org is stored as department ID resolved from t_apaas_uc_org by code 00000003/00000004 at startup
work-order.up-stcd=3206400001,3206400002,3206400003,3206400005,3206400006,3206400008,3206400009,3206400004,320640000B,320640000C,320640000A,320640000D,3206400007

# MQTT connection
mqtt.url=tcp://10.68.18.8:1883
# 固定 client-id：cleanSession=false 的持久会话按 client-id 区分，随机 id 会导致 Broker 会话泄漏
mqtt.client-id=hltgq-mq-prod
mqtt.username=sunny
mqtt.password=sunny@2025
mqtt.topics=HLTData
# 订阅 QoS：1=至少一次，配合 cleanSession=false 实现 Broker 侧离线消息缓存
mqtt.qos=1

# Water level datum (stcd = datum in meters): stored level = reported level + datum
# Only configured sites get the datum added; add a line here for new sites
water-level-datum.datum.3206400007=70
water-level-datum.datum.320640000A=40.72
water-level-datum.datum.3206400001=90

# log
logging.file.name=/app/logs/hltgq-mq.log
# MQTT payload logs use DEBUG level to avoid flooding (high frequency, ~5s per message)
logging.level.com.qgyun.hltgq.hltgqmq.config.MqttConfig=DEBUG

# stats: monthly report start date (msg stream go-live day), optional override
# empty = auto detect first day of msg_info with non-empty msg_text
# stats.start-date=2026-09-09
# stats: exclude channel sites by stcd prefix from statistics (e.g. recall-channel sites)
# empty = no exclusion
# stats.exclude-stcd-prefix=9000000

# stats: background warmup of today snapshot + today range cache (avoid first-visit cold build)
stats.warmup-enabled=true
stats.warmup-cron=0 * * * * ?

# scheduling pool: 2 threads (00:05 offline check + daily stats 并行；warmup 已异步化不占调度线程)
spring.task.scheduling.pool.size=2

# Redis Cluster：MQTT 闸门数据持久化缓冲（3 主；单 key 队列，无跨 slot 操作）
spring.redis.cluster.nodes=10.68.18.9:6382,10.68.18.9:6383,10.68.18.9:6384
spring.redis.password=Qixiao@redis20260630.com
spring.redis.timeout=3000
spring.redis.cluster.max-redirects=3
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=1
spring.redis.lettuce.pool.max-wait=2000
